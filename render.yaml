services:
  - type: web
    runtime: node
    name: sentinel-apex-api
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: EXECUTION_MODE
        value: dry-run
      - key: FEATURE_FLAG_LIVE_EXECUTION
        value: "false"
      - key: SENTINEL_ENVIRONMENT_LABEL
        value: staging demo
      - key: SENTINEL_EXECUTION_BADGE
        value: dry-run only
      - key: API_PORT
        value: "10000"
